<text x="56.0" y="375.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">put(3): evict from the minFreq bucket — key 2 goes. Each bucket is itself</text>
